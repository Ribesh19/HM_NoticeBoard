<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hockley Mint - Wall Notice Board</title>
  <link rel="icon" type="image/png" href="assets/union-jewel.png" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/weather-icons/2.0.12/css/weather-icons.min.css" />
  <link rel="stylesheet" href="tv.css" />
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@supabase/supabase-js@2.102.0/dist/umd/supabase.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script>
    function fitTV() {
      const frame = document.querySelector(".tv-frame");
      if (!frame) return;
      const s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
      frame.style.transform = "translate(-50%, -50%) scale(" + s + ")";
    }
    window.addEventListener("resize", fitTV);
    window.addEventListener("load", function () { fitTV(); setTimeout(fitTV, 100); });
    document.addEventListener("DOMContentLoaded", fitTV);
  </script>
</head>
<body>
  <div id="root"></div>
  <script src="config.js"></script>
  <script src="noticeboard-data.js"></script>
  <script type="text/babel" src="noticeboard-render.jsx"></script>
  <script type="text/babel" src="tv.jsx"></script>
</body>
</html>
